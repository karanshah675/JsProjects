<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="box">
      <div class="start-btn"></div>

      <p class="start-btn change-page"></p>
      <div class="timer">
        <p class="time">Click to Start</p>
            <div class="timer timer-setup">
          <input type="checkbox" name="time-check" id="forSession">
          <div class="edit session">
            <p>Session</p>
            <p>25 min</p>
        </div>
        <input type="checkbox" name="time-check" id="forBreak">
        <div class="edit break">
            <p>Break</p>
            <p>5 min</p>
        </div>
        <div class="time-edit">
            <button class="time-edit-btn">+</button>
            <button class="time-edit-btn">-</button>
        </div>
      </div>
      </div>
  
    </div>
  </body>
  <script src="script.js"></script>
</html>
