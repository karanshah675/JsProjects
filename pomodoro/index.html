<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="box">
      <div class="start-btn"></div>

      <p class="change-page"></p>
      <div class="timer">
        <p class="time">Click to Start</p>
      </div>
      <div class="timer-setup timer">
        <div class="edit session">
          <p>Session</p>
          <p>25 min</p>
        </div>
        <div class="edit break">
          <p>Break</p>
          <p>5 min</p>
        </div>
        <div class="time-edit">
          <button class="time-edit-btn">+</button>
          <button class="time-edit-btn">-</button>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
